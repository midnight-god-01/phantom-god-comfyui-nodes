[project]
name = "phantom-god-comfyui-nodes"
version = "1.6.3"
description = "ComfyUI graph arrangement and Pixaroma-style model-only LoRA stack node."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
classifiers = [
    "Operating System :: OS Independent",
    "Topic :: Multimedia :: Graphics",
]

[project.urls]
Homepage = "https://github.com/midnight-god-01/phantom-god-comfyui-nodes"
Repository = "https://github.com/midnight-god-01/phantom-god-comfyui-nodes"
"Bug Tracker" = "https://github.com/midnight-god-01/phantom-god-comfyui-nodes/issues"
Upstream = "https://github.com/pixaroma/ComfyUI-Pixaroma"

[tool.comfy]
requires-comfyui = ">=0.46.0"
