name: Validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "26"

      - name: Install CPU PyTorch for synthetic model tests
        run: python -m pip install --no-cache-dir torch --index-url https://download.pytorch.org/whl/cpu

      - name: Check package metadata, Python compilation, and feature registry
        run: |
          python -m py_compile __init__.py features/*.py
          python - <<'PY'
          from pathlib import Path
          import importlib.util
          import json
          import re
          import sys

          root = Path.cwd()
          spec = importlib.util.spec_from_file_location(
              "phantom_god_comfyui_nodes",
              root / "__init__.py",
              submodule_search_locations=[str(root)],
          )
          module = importlib.util.module_from_spec(spec)
          sys.modules[spec.name] = module
          spec.loader.exec_module(module)

          node_id = "PromptAdherenceEnhancerPro"
          assert module.WEB_DIRECTORY == "./web/js"
          assert set(module.NODE_CLASS_MAPPINGS) == {node_id}
          assert set(module.NODE_DISPLAY_NAME_MAPPINGS) == {node_id}
          assert module.NODE_DISPLAY_NAME_MAPPINGS[node_id] == "Prompt Adherence Enhancer Pro"
          assert (root / module.WEB_DIRECTORY / "graphArrange.js").is_file()
          assert (root / module.WEB_DIRECTORY / "prompt_adherence_enhancer_pro.js").is_file()

          project_text = (root / "pyproject.toml").read_text()
          project_version = re.search(r'^version = "([^"]+)"', project_text, re.MULTILINE).group(1)
          package_version = json.loads((root / "package.json").read_text())["version"]
          readme_version = re.search(r'^\*\*Current version:\*\* ([^ ]+)', (root / "README.md").read_text(), re.MULTILINE).group(1)
          changelog_version = re.search(r'^## ([^ ]+)', (root / "CHANGELOG.md").read_text(), re.MULTILINE).group(1)
          assert project_version == package_version == readme_version == changelog_version, (
              project_version, package_version, readme_version, changelog_version
          )
          PY

      - name: Run Python package and feature tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v

      - name: Check and test frontend JavaScript
        run: |
          npm run check:js
          npm test

      - name: Check patch whitespace
        run: git diff --check HEAD^ HEAD
