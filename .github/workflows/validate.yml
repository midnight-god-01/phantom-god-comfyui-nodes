name: Validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "26"

      - name: Check Python package and feature registry
        run: |
          python -m py_compile __init__.py features/*.py
          python - <<'PY'
          from pathlib import Path
          import importlib.util
          import sys

          root = Path.cwd()
          spec = importlib.util.spec_from_file_location(
              "phantom_god_comfyui_nodes",
              root / "__init__.py",
              submodule_search_locations=[str(root)],
          )
          module = importlib.util.module_from_spec(spec)
          sys.modules[spec.name] = module
          spec.loader.exec_module(module)

          assert module.WEB_DIRECTORY == "./web/js"
          assert module.NODE_CLASS_MAPPINGS == {}
          assert module.NODE_DISPLAY_NAME_MAPPINGS == {}
          assert (root / module.WEB_DIRECTORY / "graphArrange.js").is_file()

          removed_frontend_files = (
              "concatenateText.js",
              "environmentManager.js",
              "multiLoraModelOnly.js",
          )
          for filename in removed_frontend_files:
              assert not (root / module.WEB_DIRECTORY / filename).exists()
          PY

      - name: Run Python package tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v

      - name: Check frontend JavaScript syntax
        run: node --check web/js/graphArrange.js

      - name: Run frontend tests
        run: node --test
